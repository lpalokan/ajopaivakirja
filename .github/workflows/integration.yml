name: Integration Suite

on:
  workflow_dispatch: # manual trigger
  pull_request:
    branches: [main] # full emulator suite gates every PR into main

# One emulator run per PR/branch. The job is ~25-30 min, so cancel an
# in-progress run when a new commit is pushed instead of stacking them.
concurrency:
  group: integration-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bdd-suite:
    # Linux + KVM: ubuntu-latest exposes /dev/kvm, giving a hardware-
    # accelerated x86_64 emulator that boots reliably in CI. (The earlier
    # macos-latest/arm64 config never booted here — adb reported
    # "device 'emulator-5554' not found" until the boot timeout.)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # version.sh needs git tags + full history

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Generate Gherkin test runners
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run BDD suite on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -noaudio -camera-back none -netdelay none -netspeed full
          disable-animations: true
          emulator-boot-timeout: 900
          # Pre-grant notification permission as soon as the app is installed
          # (flutter test installs it automatically on first run).
          pre-run-steps: |
            ( for i in $(seq 1 90); do
                adb shell pm grant fi.lpalokan.kilometrikorvaus android.permission.POST_NOTIFICATIONS 2>/dev/null && break
                sleep 2
              done ) &
          script: |
            echo "::group::Run BDD suite"
            set +e
            flutter test integration_test/all_features_test.dart --reporter expanded
            status=$?
            set -e
            echo "::endgroup::"
            # Collect logcat HERE, inside the emulator-runner script, while the
            # emulator is still alive. As a separate step it ran after the
            # action had already killed the emulator, so `adb logcat -d`
            # blocked forever waiting for a device: every failing run burned
            # the full 60-minute job timeout and was reported as "cancelled"
            # rather than as the test failure it was. `timeout` is the belt to
            # that braces.
            if [ $status -ne 0 ]; then
              mkdir -p test-results
              timeout 60 adb logcat -d > test-results/logcat.txt 2>/dev/null || true
            fi
            exit $status

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-artifacts
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
