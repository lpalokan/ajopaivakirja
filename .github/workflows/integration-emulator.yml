# Runs the full Gherkin integration suite on a real Android emulator.
#
# This is the on-device counterpart to `scripts/integration-report.sh` (which
# the README/docs say is "run locally"). GitHub-hosted ubuntu-latest runners
# expose /dev/kvm, so a hardware-accelerated x86_64 emulator works here — which
# is NOT possible in environments without virtualization (e.g. Claude Code web
# containers; those use the headless host runner, scripts/host-bdd.sh).
#
# Triggers: manual (workflow_dispatch). A nightly schedule is included but
# commented out — uncomment once this is on the default branch to get
# automated coverage. (schedule/dispatch only fire for workflows on the
# default branch.)
name: Integration tests (emulator)

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 3 * * *'  # 03:00 UTC nightly

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [34]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Gherkin test runners
        run: dart run build_runner build --delete-conflicting-outputs

      # The emulator needs access to /dev/kvm; grant it to all users.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run integration suite on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell pm grant fi.lpalokan.kilometrikorvaus android.permission.POST_NOTIFICATIONS || true
            flutter test integration_test/all_features_test.dart
